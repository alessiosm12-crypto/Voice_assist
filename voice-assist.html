<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="voice-assist-mode" content="clipboard-only">
  <title>Voice assist</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1117;
      --panel: #171b24;
      --panel-soft: #11151d;
      --text: #f4f7fb;
      --muted: #98a2b3;
      --line: #2a3140;
      --accent: #49c5a2;
      --accent-strong: #68d9ba;
      --accent-text: #06130f;
      --danger: #ff7a7a;
      --ok: #73e0ad;
      --shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: min(680px, calc(100vw - 28px));
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      background: rgba(23, 27, 36, .94);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .state {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      padding: 0 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
    }

    body.recording .state {
      border-color: rgba(73, 197, 162, .45);
      color: var(--ok);
    }

    body.recording .dot {
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(73, 197, 162, .13);
    }

    #status {
      min-height: 44px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    #status.error {
      color: var(--danger);
    }

    #status.ok {
      color: var(--ok);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
      padding: 0 14px;
    }

    button.primary {
      border-color: transparent;
      background: var(--accent);
      color: var(--accent-text);
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button:hover:not(:disabled):not(.primary) {
      border-color: #3b465c;
      background: #1d2330;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    #transcript {
      display: block;
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1118;
      color: var(--text);
      font: 19px/1.45 "Segoe UI", system-ui, sans-serif;
      font-size: 19px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      padding: 16px;
      resize: vertical;
      white-space: pre-wrap;
    }

    #transcript:read-only {
      cursor: default;
    }

    #transcript::placeholder {
      color: #667085;
    }

    .dictionary-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .dictionary-tools button {
      min-height: 34px;
      border-radius: 8px;
      font-size: 13px;
      padding: 0 10px;
    }

    .dictionary-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      margin-right: auto;
    }

    .hint {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    kbd {
      min-width: 28px;
      border: 1px solid var(--line);
      border-bottom-color: #1d2330;
      border-radius: 6px;
      background: #111722;
      color: var(--text);
      font: 650 12px/1 "Segoe UI", system-ui, sans-serif;
      padding: 5px 7px;
      text-align: center;
    }

    @media (max-width: 560px) {
      main {
        padding: 18px;
      }

      .header {
        display: block;
      }

      .state {
        margin-top: 12px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div>
        <h1>Voice assist</h1>
        <p>Диктовка запускается автоматически. Нажмите «Готово», чтобы проверить текст перед копированием.</p>
      </div>
      <div class="state" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="stateText">Ожидание</span>
      </div>
    </div>

    <p id="status">Запускаю диктовку...</p>

    <div class="toolbar">
      <button id="start" class="primary" type="button" aria-label="Начать голосовой ввод">Начать</button>
      <button id="stop" type="button" aria-label="Остановить голосовой ввод" disabled>Пауза</button>
      <button id="done" type="button" aria-label="Проверить текст перед копированием">Готово</button>
      <button id="back" type="button" hidden>Вернуться</button>
    </div>

    <textarea id="transcript" aria-live="polite" placeholder="Текст появится здесь..." readonly></textarea>

    <div class="dictionary-tools" aria-label="Пользовательский словарь">
      <button id="addDictionary" class="primary" type="button" hidden>В словарь</button>
      <span id="dictionaryCount" class="dictionary-count">Словарь: 0</span>
      <button id="clearDictionary" type="button" disabled>Очистить словарь</button>
    </div>

    <div class="hint" aria-label="Горячие клавиши">
      <span><kbd>Space</kbd> пауза/старт</span>
      <span><kbd>Enter</kbd> <span id="enterHint">готово</span></span>
    </div>
  </main>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const statusEl = document.querySelector("#status");
    const stateTextEl = document.querySelector("#stateText");
    const transcriptEl = document.querySelector("#transcript");
    const startBtn = document.querySelector("#start");
    const stopBtn = document.querySelector("#stop");
    const doneBtn = document.querySelector("#done");
    const backBtn = document.querySelector("#back");
    const addDictionaryBtn = document.querySelector("#addDictionary");
    const clearDictionaryBtn = document.querySelector("#clearDictionary");
    const dictionaryCountEl = document.querySelector("#dictionaryCount");
    const enterHintEl = document.querySelector("#enterHint");
    const DICTIONARY_STORAGE_KEY = "voiceAssist.dictionary.v1";

    let recognition = null;
    let shouldRun = false;
    let isReviewing = false;
    let lastRecognitionError = "";
    let finalText = "";
    let interimText = "";
    let dictionaryTerms = loadDictionary();

    function normalize(value) {
      return value.replace(/\s+/g, " ").trim();
    }

    function normalizeDictionaryTerm(value) {
      return normalize(value);
    }

    function normalizeForDictionaryMatch(value) {
      return value
        .toLowerCase()
        .replace(/ё/g, "е")
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function compactDictionaryMatch(value) {
      return normalizeForDictionaryMatch(value).replace(/\s+/g, "");
    }

    function loadDictionary() {
      try {
        const parsed = JSON.parse(localStorage.getItem(DICTIONARY_STORAGE_KEY) || "[]");
        if (!Array.isArray(parsed)) return [];
        const seen = new Set();
        return parsed
          .map((item) => typeof item === "string" ? normalizeDictionaryTerm(item) : "")
          .filter((item) => {
            const key = item.toLowerCase();
            if (!item || seen.has(key)) return false;
            seen.add(key);
            return true;
          });
      } catch {
        return [];
      }
    }

    function saveDictionary() {
      try {
        localStorage.setItem(DICTIONARY_STORAGE_KEY, JSON.stringify(dictionaryTerms));
        return true;
      } catch {
        setStatus("Не удалось сохранить словарь в браузере.", "error");
        return false;
      }
    }

    function updateDictionaryUi() {
      dictionaryCountEl.textContent = `Словарь: ${dictionaryTerms.length}`;
      clearDictionaryBtn.disabled = dictionaryTerms.length === 0;
      updateDictionarySelection();
    }

    function selectedDictionaryTerm() {
      if (transcriptEl.readOnly) return "";
      const selected = transcriptEl.value.slice(transcriptEl.selectionStart, transcriptEl.selectionEnd);
      const term = normalizeDictionaryTerm(selected);
      return /[\p{L}\p{N}]/u.test(term) ? term : "";
    }

    function updateDictionarySelection() {
      addDictionaryBtn.hidden = !selectedDictionaryTerm();
    }

    function addSelectedTermToDictionary() {
      const term = selectedDictionaryTerm();
      if (!term) return;

      const key = term.toLowerCase();
      if (dictionaryTerms.some((item) => item.toLowerCase() === key)) {
        setStatus(`Уже есть в словаре: ${term}`, "ok");
        updateDictionarySelection();
        return;
      }

      dictionaryTerms.push(term);
      if (!saveDictionary()) {
        dictionaryTerms.pop();
        updateDictionaryUi();
        return;
      }
      updateDictionaryUi();
      setStatus(`Добавлено в словарь: ${term}`, "ok");
      transcriptEl.focus();
    }

    function clearDictionary() {
      if (!dictionaryTerms.length) return;
      if (!window.confirm("Очистить весь пользовательский словарь?")) return;
      const previousTerms = dictionaryTerms;
      dictionaryTerms = [];
      if (!saveDictionary()) {
        dictionaryTerms = previousTerms;
        updateDictionaryUi();
        return;
      }
      updateDictionaryUi();
      setStatus("Словарь очищен.", "ok");
      transcriptEl.focus();
    }

    function similarity(left, right) {
      if (!left || !right) return 0;
      const rows = Array.from({ length: left.length + 1 }, (_, index) => index);
      for (let i = 1; i <= right.length; i += 1) {
        let previous = rows[0];
        rows[0] = i;
        for (let j = 1; j <= left.length; j += 1) {
          const current = rows[j];
          const cost = left[j - 1] === right[i - 1] ? 0 : 1;
          rows[j] = Math.min(rows[j] + 1, rows[j - 1] + 1, previous + cost);
          previous = current;
        }
      }
      const distance = rows[left.length];
      return 1 - distance / Math.max(left.length, right.length);
    }

    function wordMatches(value) {
      return Array.from(value.matchAll(/[\p{L}\p{N}]+(?:-[\p{L}\p{N}]+)*/gu));
    }

    function applyDictionary(value) {
      if (!dictionaryTerms.length || !value) return value;

      let result = value;
      const terms = [...dictionaryTerms].sort((a, b) => b.length - a.length);
      for (const term of terms) {
        const normalizedTerm = normalizeForDictionaryMatch(term);
        if (normalizedTerm.length < 4) continue;

        const termWords = normalizedTerm.split(" ");
        const windowSizes = Array.from(new Set([termWords.length - 1, termWords.length, termWords.length + 1]))
          .filter((size) => size > 0);
        const threshold = termWords.length === 1 ? 0.86 : 0.78;

        for (const windowSize of windowSizes) {
          const words = wordMatches(result);
          for (let index = words.length - windowSize; index >= 0; index -= 1) {
            const first = words[index];
            const last = words[index + windowSize - 1];
            const candidate = result.slice(first.index, last.index + last[0].length);
            const normalizedCandidate = normalizeForDictionaryMatch(candidate);
            if (normalizedCandidate.length < 4) continue;
            const spacedScore = similarity(normalizedCandidate, normalizedTerm);
            const compactScore = similarity(compactDictionaryMatch(candidate), compactDictionaryMatch(term));
            if (Math.max(spacedScore, compactScore) < threshold) continue;

            result = `${result.slice(0, first.index)}${term}${result.slice(last.index + last[0].length)}`;
          }
        }
      }

      return result;
    }

    function capitalizeSentences(value) {
      return value.replace(/(^|[.!?]\s+)([а-яёa-z])/giu, (_, prefix, letter) => `${prefix}${letter.toUpperCase()}`);
    }

    function lowercaseFirst(value) {
      return value ? `${value[0].toLowerCase()}${value.slice(1)}` : value;
    }

    function addSoftBreaksBeforeCapitals(value) {
      return value.replace(/([а-яёa-z0-9])\s+([А-ЯЁA-Z][а-яёa-z]+)/gu, (match, previousChar, nextWord, offset, source) => {
        const beforeBreak = source.slice(0, offset + 1);
        const currentSegment = beforeBreak.split(/[.!?]/).pop().trim();
        const wordCount = currentSegment ? currentSegment.split(/\s+/).length : 0;

        if (wordCount >= 7) {
          return `${previousChar}. ${nextWord}`;
        }
        if (wordCount >= 4) {
          return `${previousChar}, ${lowercaseFirst(nextWord)}`;
        }
        return `${previousChar} ${lowercaseFirst(nextWord)}`;
      });
    }

    function addRussianCommas(value) {
      const introductoryWords = "например|кстати|впрочем|значит|итак|наконец|конечно|возможно|вероятно|кажется|пожалуйста|видимо|очевидно|по-моему|во-первых|во-вторых|с одной стороны|с другой стороны";
      const relativeWords = "который|которая|которое|которые|которого|которой|которых|которому|которым|которыми|котором";
      const subordinateWords = "что|чтобы|если|когда|пока|хотя|поскольку|где|куда|откуда|зачем|почему";
      const compoundConjunctions = [
        "потому что",
        "так как",
        "для того чтобы",
        "несмотря на то что",
        "из-за того что",
        "перед тем как",
        "после того как",
        "в то время как",
        "по мере того как"
      ];

      const protectedPhrases = [];
      const protectedText = value.replace(
        new RegExp(`(^|\\s)(${compoundConjunctions.join("|")})(?=$|\\s|[,.;:!?])`, "giu"),
        (_match, prefix, phrase) => {
          const token = `__compound_${protectedPhrases.length}__`;
          protectedPhrases.push(phrase);
          return `${prefix}${token}`;
        }
      );

      return protectedText
        .replace(/([^\s,.;:!?])\s+(а|но|однако|зато|поэтому)(?=$|\s|[,.;:!?])/giu, "$1, $2")
        .replace(new RegExp(`([^\\s,.;:!?])\\s+(${introductoryWords})\\s+`, "giu"), "$1, $2, ")
        .replace(new RegExp(`(^|[.!?]\\s+)(${introductoryWords})\\s+`, "giu"), "$1$2, ")
        .replace(/([^\s,.;:!?])\s+(то есть)(?=$|\s|[,.;:!?])/giu, "$1, $2")
        .replace(/([^\s,.;:!?])\s+(__compound_\d+__)(?=$|\s|[,.;:!?])/giu, "$1, $2")
        .replace(new RegExp(`([^\\s,.;:!?])\\s+(${subordinateWords})(?=$|\\s|[,.;:!?])`, "giu"), "$1, $2")
        .replace(new RegExp(`([^\\s,.;:!?])\\s+(${relativeWords})(?=$|\\s|[,.;:!?])`, "giu"), "$1, $2")
        .replace(/(^|[.!?]\s+)(если[^.!?]*?)\s+(то)(?=$|\s|[,.;:!?])/giu, "$1$2, $3")
        .replace(/([,;:]\s+)(если[^.!?]*?)\s+(то)(?=$|\s|[,.;:!?])/giu, "$1$2, $3")
        .replace(/__compound_(\d+)__/g, (_, index) => protectedPhrases[Number(index)]);
    }

    function cleanPunctuation(value) {
      return value
        .replace(/\s+([,.;:!?])/g, "$1")
        .replace(/([,.;:!?])(?=\S)/g, "$1 ")
        .replace(/,\s*,+/g, ",")
        .replace(/,\s*([.!?])/g, "$1")
        .replace(/([.!?])\s+([,.;:!?])/g, "$1 ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function protectPhrases(value, phrases) {
      const protectedPhrases = [];
      const pattern = new RegExp(`(^|\\s)(${phrases.join("|")})(?=$|\\s|[,.;:!?])`, "giu");
      const text = value.replace(pattern, (_match, prefix, phrase) => {
        const token = `__protected_${protectedPhrases.length}__`;
        protectedPhrases.push(phrase);
        return `${prefix}${token}`;
      });
      return {
        text,
        restore: (restoredText) => restoredText.replace(/__protected_(\d+)__/g, (_, index) => protectedPhrases[Number(index)])
      };
    }

    function finalRussianReview(value) {
      let text = autoEditText(value);
      if (!text) return "";

      const compoundConjunctions = [
        "потому что",
        "так как",
        "для того чтобы",
        "несмотря на то что",
        "из-за того что",
        "перед тем как",
        "после того как",
        "в то время как",
        "по мере того как"
      ];
      const introductoryWords = "например|кстати|впрочем|значит|итак|наконец|конечно|возможно|вероятно|кажется|пожалуйста|видимо|очевидно|по-моему|во-первых|во-вторых|с одной стороны|с другой стороны";
      const subordinateWords = "что|чтобы|если|когда|пока|хотя|поскольку|где|куда|откуда|зачем|почему";
      const relativeWords = "который|которая|которое|которые|которого|которой|которых|которому|которым|которыми|котором";
      const protectedCompounds = protectPhrases(text, compoundConjunctions);

      text = protectedCompounds.text
        .replace(/([^\s,.;:!?])\s+(а|но|однако|зато|поэтому)(?=$|\s|[,.;:!?])/giu, "$1, $2")
        .replace(new RegExp(`([^\\s,.;:!?])\\s+(${introductoryWords})(?=$|\\s|[,.;:!?])`, "giu"), "$1, $2")
        .replace(new RegExp(`(^|[.!?]\\s+)(${introductoryWords})(?=$|\\s|[,.;:!?])`, "giu"), "$1$2")
        .replace(new RegExp(`(${introductoryWords})\\s+([^,.;:!?\\s])`, "giu"), "$1, $2")
        .replace(/([^\s,.;:!?])\s+(то есть)(?=$|\s|[,.;:!?])/giu, "$1, $2")
        .replace(/([^\s,.;:!?])\s+(__protected_\d+__)(?=$|\s|[,.;:!?])/giu, "$1, $2")
        .replace(new RegExp(`([^\\s,.;:!?])\\s+(${subordinateWords})(?=$|\\s|[,.;:!?])`, "giu"), "$1, $2")
        .replace(new RegExp(`([^\\s,.;:!?])\\s+(${relativeWords})(?=$|\\s|[,.;:!?])`, "giu"), "$1, $2")
        .replace(/(^|[.!?]\s+)(если[^.!?]*?)\s+(то)(?=$|\s|[,.;:!?])/giu, "$1$2, $3")
        .replace(/([,;:]\s+)(если[^.!?]*?)\s+(то)(?=$|\s|[,.;:!?])/giu, "$1$2, $3");

      text = protectedCompounds.restore(text);
      text = cleanPunctuation(text)
        .replace(/([,.;:!?])\1+/g, "$1")
        .replace(/([.!?])\s*([.!?])+/g, "$1")
        .replace(/,\s*([,.;:!?])/g, "$1")
        .replace(/\s+-\s+/g, " - ");
      text = capitalizeSentences(text);
      if (!/[.!?]$/.test(text)) {
        text += ".";
      }
      return text;
    }

    function autoEditText(value, finalize = true) {
      let text = normalize(value);
      if (!text) return "";

      text = applyDictionary(text);
      text = cleanPunctuation(text);
      text = addSoftBreaksBeforeCapitals(text);
      text = addRussianCommas(text);
      text = cleanPunctuation(text);
      text = capitalizeSentences(text);
      if (finalize && !/[.!?]$/.test(text)) {
        text += ".";
      }
      return text;
    }

    function appendFinalPhrase(phrase) {
      const cleanPhrase = normalize(applyDictionary(phrase));
      if (!cleanPhrase) return;
      if (!finalText) {
        finalText = cleanPhrase;
      } else {
        finalText = `${finalText} ${cleanPhrase}`;
      }
      finalText = autoEditText(finalText, false);
    }

    function setRecordingState(isRecording, focusEditor = false) {
      document.body.classList.toggle("recording", isRecording);
      stateTextEl.textContent = isReviewing ? "Проверка" : (isRecording ? "Слушаю" : "Пауза");
      transcriptEl.readOnly = isRecording;
      updateDictionarySelection();
      if (!isRecording && focusEditor) {
        transcriptEl.focus();
        transcriptEl.setSelectionRange(transcriptEl.value.length, transcriptEl.value.length);
      }
    }

    function setStatus(message, mode = "") {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", mode === "error");
      statusEl.classList.toggle("ok", mode === "ok");
    }

    function isTerminalRecognitionError(error) {
      return ["not-allowed", "service-not-allowed", "audio-capture", "network", "language-not-supported"].includes(error);
    }

    function fullTranscript() {
      return autoEditText(transcriptEl.value || `${finalText} ${interimText}`);
    }

    function renderTranscript() {
      transcriptEl.value = interimText
        ? autoEditText(`${finalText} ${interimText}`, false)
        : autoEditText(finalText, false);
    }

    async function postText(path, text = "") {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "text/plain; charset=utf-8" },
        body: text
      });
      if (!response.ok) {
        throw new Error(await response.text());
      }
    }

    function createRecognition() {
      if (!SpeechRecognition) {
        setStatus("В этом браузере нет Web Speech API. Откройте окно в Chrome или Edge.", "error");
        startBtn.disabled = true;
        stopBtn.disabled = true;
        setRecordingState(false);
        stateTextEl.textContent = "Недоступно";
        return null;
      }

      const instance = new SpeechRecognition();
      instance.lang = "ru-RU";
      instance.continuous = true;
      instance.interimResults = true;
      instance.maxAlternatives = 1;

      instance.onstart = () => {
        lastRecognitionError = "";
        startBtn.disabled = true;
        stopBtn.disabled = false;
        setRecordingState(true);
        setStatus("Слушаю. Говорите по-русски, затем нажмите «Готово».", "ok");
      };

      instance.onresult = (event) => {
        interimText = "";
        for (let i = event.resultIndex; i < event.results.length; i += 1) {
          const part = normalize(event.results[i][0].transcript);
          if (!part) continue;
          if (event.results[i].isFinal) {
            appendFinalPhrase(part);
          } else {
            interimText = applyDictionary(part);
          }
        }
        renderTranscript();
      };

      instance.onerror = (event) => {
        lastRecognitionError = event.error;
        let message = `Ошибка распознавания: ${event.error}`;
        if (event.error === "not-allowed") {
          message = "Разрешите микрофон для этой страницы, затем запустите диктовку снова.";
        } else if (event.error === "audio-capture") {
          message = "Браузер не получил звук с микрофона. Проверьте микрофон и разрешения Windows.";
        } else if (event.error === "network") {
          message = "Распознавание требует интернет-соединение. Проверьте сеть и попробуйте снова.";
        } else if (event.error === "no-speech") {
          message = "Речь не обнаружена. Можно продолжить диктовку.";
        }
        if (isTerminalRecognitionError(event.error)) {
          shouldRun = false;
        }
        setStatus(message, event.error === "no-speech" ? "" : "error");
      };

      instance.onend = () => {
        startBtn.disabled = false;
        stopBtn.disabled = true;
        if (isReviewing) {
          startBtn.disabled = true;
          return;
        }
        if (lastRecognitionError && isTerminalRecognitionError(lastRecognitionError)) {
          setRecordingState(false);
          stateTextEl.textContent = "Ошибка";
          return;
        }
        if (shouldRun) {
          setRecordingState(false);
          window.setTimeout(() => {
            try {
              instance.start();
            } catch {
              shouldRun = false;
              setStatus("Диктовка остановлена браузером. Нажмите «Начать», чтобы продолжить.", "error");
            }
          }, 200);
        } else {
          setRecordingState(false, true);
          setStatus("Диктовка остановлена.", "ok");
        }
      };

      return instance;
    }

    function startRecognition() {
      if (isReviewing) return;
      if (!recognition) recognition = createRecognition();
      if (!recognition) return;

      finalText = autoEditText(transcriptEl.value, false);
      interimText = "";
      renderTranscript();
      shouldRun = true;
      lastRecognitionError = "";
      try {
        recognition.start();
      } catch {
        setStatus("Диктовка уже запускается.", "error");
      }
    }

    function stopRecognition() {
      shouldRun = false;
      if (recognition) recognition.stop();
    }

    function toggleRecognition() {
      if (isReviewing) return;
      shouldRun ? stopRecognition() : startRecognition();
    }

    function enterReviewMode(text) {
      isReviewing = true;
      shouldRun = false;
      finalText = text;
      interimText = "";
      transcriptEl.value = text;
      transcriptEl.readOnly = false;
      document.body.classList.remove("recording");
      stateTextEl.textContent = "Проверка";
      startBtn.disabled = true;
      stopBtn.disabled = true;
      doneBtn.disabled = false;
      doneBtn.textContent = "Скопировать";
      doneBtn.setAttribute("aria-label", "Скопировать проверенный текст и закрыть окно");
      enterHintEl.textContent = "копировать";
      backBtn.hidden = false;
      setStatus("Текст проверен. Проверьте результат и нажмите «Скопировать».", "ok");
      transcriptEl.focus();
      transcriptEl.setSelectionRange(transcriptEl.value.length, transcriptEl.value.length);
      updateDictionarySelection();
    }

    function leaveReviewMode() {
      isReviewing = false;
      finalText = autoEditText(transcriptEl.value, false);
      interimText = "";
      doneBtn.textContent = "Готово";
      doneBtn.setAttribute("aria-label", "Проверить текст перед копированием");
      enterHintEl.textContent = "готово";
      backBtn.hidden = true;
      setRecordingState(false, true);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      renderTranscript();
      setStatus("Можно отредактировать текст или продолжить диктовку.", "ok");
    }

    function prepareReview() {
      const text = fullTranscript();
      if (!text) {
        setStatus("Пока нечего копировать.", "error");
        return;
      }

      stopRecognition();
      enterReviewMode(finalRussianReview(text));
    }

    async function copyReviewedText() {
      const text = normalize(transcriptEl.value);
      if (!text) {
        setStatus("Пока нечего копировать.", "error");
        return;
      }

      doneBtn.disabled = true;
      setStatus("Копирую текст в буфер обмена...", "ok");
      try {
        await postText("/copy", text);
        setStatus("Скопировано. Теперь можно вставить текст в любое окно через Ctrl+V.", "ok");
        window.setTimeout(() => window.close(), 350);
      } catch (error) {
        doneBtn.disabled = false;
        setStatus(`Не удалось скопировать текст: ${error.message}`, "error");
      }
    }

    function finishDictation() {
      if (isReviewing) {
        copyReviewedText();
        return;
      }
      prepareReview();
    }

    startBtn.addEventListener("click", startRecognition);
    stopBtn.addEventListener("click", stopRecognition);
    doneBtn.addEventListener("click", finishDictation);
    backBtn.addEventListener("click", leaveReviewMode);
    addDictionaryBtn.addEventListener("click", addSelectedTermToDictionary);
    clearDictionaryBtn.addEventListener("click", clearDictionary);
    transcriptEl.addEventListener("select", updateDictionarySelection);
    transcriptEl.addEventListener("keyup", updateDictionarySelection);
    transcriptEl.addEventListener("mouseup", updateDictionarySelection);
    transcriptEl.addEventListener("input", () => {
      finalText = autoEditText(transcriptEl.value, false);
      updateDictionarySelection();
    });

    window.addEventListener("keydown", (event) => {
      if (event.isComposing) return;
      if (event.target === transcriptEl && !transcriptEl.readOnly) return;
      if (event.code === "Space" && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
        event.preventDefault();
        toggleRecognition();
        return;
      }
      if ((event.code === "Enter" || event.code === "NumpadEnter") && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
        event.preventDefault();
        finishDictation();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.code === "KeyM") {
        event.preventDefault();
        toggleRecognition();
      }
    });

    setRecordingState(false);
    updateDictionaryUi();

    if (!SpeechRecognition) {
      setStatus("В этом браузере нет Web Speech API. Откройте окно в Chrome или Edge.", "error");
      startBtn.disabled = true;
      stopBtn.disabled = true;
      stateTextEl.textContent = "Недоступно";
    } else {
      window.addEventListener("load", () => {
        window.setTimeout(startRecognition, 250);
      });
    }
  </script>
</body>
</html>
